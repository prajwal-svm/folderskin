[workspace]
resolver = "2"
members = [
    "crates/folderskin-ai",
    "crates/folderskin-core",
    "crates/folderskin-tools",
    "src-tauri",
    "crates/folderskin-keys",
    "crates/folderskin-local",
    "crates/folderskin-cli",
    "crates/folderskin-catalog",
    "crates/folderskin-share",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/prajwal-svm/folderskin"

[workspace.dependencies]
folderskin-core = { path = "crates/folderskin-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# reqwest 0.13 renamed the rustls feature from "rustls-tls" to "rustls"; it brings its own
# certificate verifier, so no native-tls/openssl is linked on any platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "charset", "http2"] }
base64 = "0.23"
sha2 = "0.10"
# keyring 4 has no default platform backends; "v1" selects the macOS keychain, the Windows
# credential manager and the pure-Rust zbus secret-service client on Linux.
keyring = { version = "4", default-features = false, features = ["v1"] }
# Only the timer, for polling asynchronous image providers.
tokio = { version = "1", default-features = false, features = ["time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`. Commands do their work on blocking threads, and unwinding is what lets a
# panic there come back as a failed command the window can put in a sentence — with abort, one
# panic anywhere took the whole app down mid-apply, with nothing on screen to say why and no
# console to print to (main.rs makes the release build a windows_subsystem binary). Unwinding
# costs a little size; a GUI that vanishes while it is writing to the user's folders costs more.

# The crates that draw, cut out and code pictures are built for speed even in a release, where
# everything else is built small: measured on an M3 Pro, a library thumbnail took 540-580 ms
# built small and 325-355 ms like this, every shape picture for the pickers 1.15 s and 0.6 s,
# and a free icon's cut-out 435-445 ms and 270-280 ms, for 0.49 MB more binary (14.78 MB to
# 15.29 MB). The rest of the app stays at "s".
[profile.release.package.folderskin-core]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.adler2]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.libwebp-sys]
opt-level = 3

[profile.release.package.webp]
opt-level = 3

# Rendering at 2048 px in an unoptimised build takes seconds per icon; keep the pixel crates fast in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.folderskin-core]
opt-level = 3
