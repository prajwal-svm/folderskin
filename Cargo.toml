[workspace]
resolver = "2"
members = ["crates/folderskin-core", "crates/folderskin-tools", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/prajwal-svm/folderskin"

[workspace.dependencies]
folderskin-core = { path = "crates/folderskin-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Rendering at 2048 px in an unoptimised build takes seconds per icon; keep the pixel crates fast in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.folderskin-core]
opt-level = 3
