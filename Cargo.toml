[workspace]
resolver = "2"
members = [
    "crates/folderskin-ai",
    "crates/folderskin-core",
    "crates/folderskin-tools",
    "src-tauri",
    "crates/folderskin-keys",
    "crates/folderskin-local",
    "crates/folderskin-cli",
    "crates/folderskin-catalog",
    "crates/folderskin-share",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/prajwal-svm/folderskin"

[workspace.dependencies]
folderskin-core = { path = "crates/folderskin-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# reqwest 0.13 renamed the rustls feature from "rustls-tls" to "rustls"; it brings its own
# certificate verifier, so no native-tls/openssl is linked on any platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "charset", "http2"] }
base64 = "0.23"
sha2 = "0.10"
# keyring 4 has no default platform backends; "v1" selects the macOS keychain, the Windows
# credential manager and the pure-Rust zbus secret-service client on Linux.
keyring = { version = "4", default-features = false, features = ["v1"] }
# Only the timer, for polling asynchronous image providers.
tokio = { version = "1", default-features = false, features = ["time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`. Commands do their work on blocking threads, and unwinding is what lets a
# panic there come back as a failed command the window can put in a sentence — with abort, one
# panic anywhere took the whole app down mid-apply, with nothing on screen to say why and no
# console to print to (main.rs makes the release build a windows_subsystem binary). Unwinding
# costs a little size; a GUI that vanishes while it is writing to the user's folders costs more.

# Rendering at 2048 px in an unoptimised build takes seconds per icon; keep the pixel crates fast in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.folderskin-core]
opt-level = 3
