sonar.projectName=FolderSkin
sonar.sourceEncoding=UTF-8

# The app (React), its Rust crates and the Tauri side. The community packs, the docs and
# generated files are outside this scope. The organisation and project key come from the
# repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY (see docs/CI.md).
sonar.sources=src,crates,src-tauri/src,src-tauri/build.rs
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
# The tests sit beside the code they test, so they are kept out of the sources as well.
sonar.exclusions=src/**/*.test.ts

# CI writes these reports before the scanner runs.
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust/lcov.info

# Coverage is measured where tests run on the Linux CI runner. Everything below is still analysed
# for bugs, code smells and security hotspots; it just doesn't count towards coverage.
# - The React components, hooks and the bridge to Rust (src/lib/tauri.ts) have no component
#   tests yet. The type checker and trying the app are what check them.
# - src/lib/devMock.ts stands in for the Rust side when the UI runs in a plain browser.
# - apply/macos.rs and apply/windows.rs only compile on their own systems. The macOS and Windows
#   CI jobs test them, but those jobs report no coverage.
# - folderskin-tools is the maintainers' command line, and the examples are one-off scripts.
sonar.coverage.exclusions=src/App.tsx,src/main.tsx,src/components/**,src/hooks/**,src/lib/tauri.ts,src/lib/devMock.ts,crates/folderskin-core/src/apply/macos.rs,crates/folderskin-core/src/apply/windows.rs,crates/folderskin-core/examples/**,crates/folderskin-tools/**

# CI already runs Clippy with warnings denied; running it again inside the scanner adds nothing.
sonar.rust.clippy.enabled=false
sonar.rust.cargo.manifestPaths=Cargo.toml

# Rust unit tests live in a `mod tests { ... }` at the end of each file. Sonar tells tests apart
# by path, so it would analyse those modules as production code and flag their fixtures. Ignore
# issues from the module's opening line to the end of the file (an empty end pattern means the end
# of the file). Backslashes are doubled because the scanner reads this file with Java properties
# escaping.
sonar.issue.ignore.block=rustInlineTests
sonar.issue.ignore.block.rustInlineTests.beginBlockRegexp=^\\s*(?:pub(?:\\(crate\\))?\\s+)?mod \\w*tests\\s*\\{\\s*$
sonar.issue.ignore.block.rustInlineTests.endBlockRegexp=
