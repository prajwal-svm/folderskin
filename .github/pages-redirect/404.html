<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FolderSkin is at folderskin.app</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://folderskin.app/" />
    <meta http-equiv="refresh" content="0; url=https://folderskin.app/" />
    <script>
      // The same page on folderskin.app: this site was served under /folderskin/.
      const path = location.pathname.replace(/^\/folderskin(?=\/|$)/, "") || "/";
      location.replace("https://folderskin.app" + path + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>FolderSkin's website is now at <a href="https://folderskin.app/">folderskin.app</a>.</p>
  </body>
</html>
