name: Downloads

# The downloads badge counts installers people actually downloaded.
#
# Shields' own `github/downloads/.../total` counts every release asset, and the biggest of those
# is `latest.json`: every running copy of FolderSkin fetches it to check for an update, so it
# climbs on its own and swamps the real number. It read 59 when 10 installers had been downloaded.
# Shields has no way to say "everything except that file" — asset names there are matched
# literally, with no wildcards — so the total is worked out here and published as a shields
# endpoint file the README points at.
#
# The file lives on a branch of its own, `badges`, which holds nothing else. `main` is protected
# (its changes come through pull requests that pass CI), and a ruleset on a repository owned by a
# person, not an organisation, can't let GitHub Actions push past that.
on:
  schedule:
    # Once a day. Download counts don't need to be live, and this keeps the history quiet.
    - cron: "17 6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    name: Count the installers
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: downloads-badge
      cancel-in-progress: false
    steps:
      - name: Add up the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An installer is a file a person downloads and runs. That leaves out `latest.json`,
          # the `.sig` signatures beside each asset, and `.app.tar.gz`, which only the macOS
          # updater fetches — whoever gets that was counted when they took the DMG.
          total=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[].assets[] | select(.name | test("\\.(dmg|exe|msi|AppImage|deb|rpm)$")) | .download_count' \
            | awk '{ n += $1 } END { print n + 0 }')
          echo "Installers downloaded: $total"
          printf '{\n  "schemaVersion": 1,\n  "label": "downloads",\n  "message": "%s",\n  "color": "3A86FF"\n}\n' "$total" > "$RUNNER_TEMP/downloads.json"

      # Onto the `badges` branch, made by the first run with nothing on it but this file. A push
      # made with the workflow's own token starts no other workflow, so it cannot start another run.
      - name: Publish it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q -b badges badges
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin badges 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          fi
          cp "$RUNNER_TEMP/downloads.json" downloads.json
          if [ -z "$(git status --porcelain -- downloads.json)" ]; then
            echo "The downloads badge is up to date."
            exit 0
          fi
          git add -- downloads.json
          git commit -q -m "Update the downloads count"
          git push -q origin badges
