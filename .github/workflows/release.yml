name: Release

#     git tag v0.1.0 && git push origin v0.1.0
#
# or run it from the Actions tab with the tag to build.
#
# A tag always stops at a complete, checked DRAFT: every platform is built, signed where it can
# be, and attached, but nobody can see the release yet. Making it public is a second, deliberate
# step, once you have tried the draft's installers: run this workflow from the Actions tab for the
# same tag with "Publish the release" ticked. That run builds nothing. It checks the draft again
# and publishes exactly what you tried. docs/RELEASING.md has the whole routine and the secrets it
# reads.
#
# Publishing also starts the update: every installed FolderSkin reads the newest public release's
# latest.json, which the update-feed job below attaches to the draft.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build or publish (e.g. v0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish the draft already built for this tag. Leave unticked to build a draft."
        required: false
        default: false
        type: boolean

permissions:
  contents: write # tauri-action creates the draft release and uploads the installers

jobs:
  # The draft release comes first, made on the existing tag with no target commit. GitHub refuses
  # the workflow token a release (or a tag) at a commit whose .github/workflows differ from main's
  # tip, with a bare "Resource not accessible by integration", and main can move while the builds
  # run: v0.1.0's builds were refused once a workflow change landed on main after the tag.
  # tauri-action would create the release at the tag's commit; with the draft already there it
  # only uploads.
  draft:
    name: Draft release
    if: ${{ inputs.publish != true }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The release notes are the version's section of CHANGELOG.md. tauri-action also puts them
      # in latest.json, and the app shows them when it offers the update.
      - name: Write the release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          section="$(awk -v v="$version" '
            /^## / {
              if (found) exit
              if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::there is no \"## $version\" section to use as the release notes"
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$section"
            echo
            echo '---'
            echo
            echo "**Downloads:** macOS (Apple silicon and Intel) \`.dmg\`, Windows \`-setup.exe\` or \`.msi\`, Linux \`.AppImage\`, \`.deb\` or \`.rpm\` for x86_64 and ARM64."
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft, or keep the one there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          NOTES: ${{ steps.notes.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id' | grep -q .; then
            echo "$TAG already has a release; the builds add to it"
            exit 0
          fi
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "FolderSkin $TAG" --notes-file notes.md

  build:
    name: ${{ matrix.name }}
    needs: draft
    if: ${{ inputs.publish != true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # `feed`: the start of the keys this build owns in latest.json, the update feed
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
            feed: darwin
            # Every macOS build notarizes, which is a sign-in to Apple; see "Check the
            # notarization sign-in".
            retries: 0
          - name: Linux (x86_64)
            os: ubuntu-22.04
            targets: ""
            args: ""
            feed: linux-x86_64
            retries: 3
          - name: Linux (ARM64)
            os: ubuntu-22.04-arm
            targets: ""
            args: ""
            feed: linux-aarch64
            retries: 3
          - name: Windows (x86_64)
            os: windows-latest
            targets: ""
            args: ""
            feed: windows-x86_64
            retries: 3

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Ubuntu 22.04 on both Linux runners, so the packages run on any system with glibc 2.35 or
      # newer. xdg-utils: the AppImage carries xdg-open for the opener plugin, and the ARM64
      # image doesn't have it.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils

      - name: Install pnpm
        # The version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The installers are named after the version in tauri.conf.json, so a tag that doesn't
      # match it would attach installers of another version.
      - name: Check that the tag matches the version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            have="$(node -p "require('./$file').version")"
            [ "$have" = "$want" ] || { echo "::error file=$file::the version is $have, but the tag is $TAG"; exit 1; }
          done
          have="$(awk -F'"' '/^version[ \t]*=/ { print $2; exit }' Cargo.toml)"
          [ "$have" = "$want" ] || { echo "::error file=Cargo.toml::the workspace version is $have, but the tag is $TAG"; exit 1; }

      # macOS signing and notarization, with the same six secrets as Oleafly. Each APPLE_* value
      # is exported only when its secret exists: an empty variable would make the bundler sign
      # with an empty identity, while an absent one means an unsigned build. A release from this
      # repository has to be signed, so here missing secrets stop the build; a fork builds
      # unsigned.
      - name: Turn on macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="SECRET_${name}"
            [ -n "${!value}" ] || missing+=("$name")
          done
          if ((${#missing[@]} == 6)) && [ "$GITHUB_REPOSITORY" != "prajwal-svm/folderskin" ]; then
            echo "macOS signing: no secrets in this fork, building unsigned"
            exit 0
          fi
          if ((${#missing[@]})); then
            echo "::error::missing or empty signing secrets: ${missing[*]}. docs/RELEASING.md says how to set them."
            exit 1
          fi
          export_env() {
            {
              echo "$1<<FOLDERSKIN_SECRET_EOF"
              echo "$2"
              echo "FOLDERSKIN_SECRET_EOF"
            } >> "$GITHUB_ENV"
          }
          export_env APPLE_CERTIFICATE "$SECRET_APPLE_CERTIFICATE"
          export_env APPLE_CERTIFICATE_PASSWORD "$SECRET_APPLE_CERTIFICATE_PASSWORD"
          export_env APPLE_SIGNING_IDENTITY "$SECRET_APPLE_SIGNING_IDENTITY"
          export_env APPLE_ID "$SECRET_APPLE_ID"
          export_env APPLE_PASSWORD "$SECRET_APPLE_PASSWORD"
          export_env APPLE_TEAM_ID "$SECRET_APPLE_TEAM_ID"
          export_env KEYCHAIN_PASSWORD "$(openssl rand -hex 24)"
          echo "MACOS_SIGNED=true" >> "$GITHUB_ENV"
          echo "macOS signing: on"

      # One sign-in to Apple's notary service before the long build, so a wrong APPLE_ID or
      # APPLE_PASSWORD fails here in seconds, and only once. Failed sign-ins add up: v0.1.0's
      # builds retried notarization with a wrong password until Apple locked the Apple ID. So the
      # macOS build never retries either (matrix.retries).
      - name: Check the notarization sign-in
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! out="$(xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1)"; then
            printf '%s\n' "$out" | head -5
            echo "::error::Apple refused the notarization sign-in. APPLE_ID must be the developer account's Apple ID and APPLE_PASSWORD an app-specific password from account.apple.com. Fix the secrets before running this again: repeated failed sign-ins lock the Apple ID."
            exit 1
          fi
          echo "notarization sign-in: ok"

      # Windows Authenticode through Azure Trusted Signing, as in Oleafly. Only when the AZURE_*
      # secrets exist; otherwise the Windows installers are unsigned.
      - name: Turn on Windows signing (when its secrets exist)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SECRET_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SECRET_AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          SECRET_AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          SECRET_AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$SECRET_AZURE_CLIENT_ID" ]; then
            echo "Windows signing: secrets not set, building unsigned"
            exit 0
          fi
          if [ -z "$SECRET_AZURE_SIGNING_ENDPOINT" ] || [ -z "$SECRET_AZURE_SIGNING_ACCOUNT" ] || [ -z "$SECRET_AZURE_SIGNING_PROFILE" ]; then
            echo "::error::AZURE_CLIENT_ID is set, but the endpoint, account or profile secret is missing"
            exit 1
          fi
          cargo install artifact-signing-cli
          printf '{"bundle":{"windows":{"signCommand":"artifact-signing-cli -e %s -a %s -c %s -d FolderSkin %%1"}}}' \
            "$SECRET_AZURE_SIGNING_ENDPOINT" "$SECRET_AZURE_SIGNING_ACCOUNT" "$SECRET_AZURE_SIGNING_PROFILE" \
            > src-tauri/tauri.windows-signing.conf.json
          echo 'TAURI_SIGN_ARGS=--config src-tauri/tauri.windows-signing.conf.json' >> "$GITHUB_ENV"
          echo "Windows signing: on"

      # Updates. An installed FolderSkin installs only what the key in tauri.conf.json
      # (plugins.updater.pubkey) signed. With the private half, the bundler signs each installer
      # and tauri-action writes latest.json, the feed the app reads. A release from this repository
      # needs it, or nobody would be offered the new version; a fork builds without.
      - name: Turn on update signing
        shell: bash
        env:
          SECRET_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REPOSITORY" = "prajwal-svm/folderskin" ]; then
              echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing, so this release would offer no update. docs/RELEASING.md says how to set it."
              exit 1
            fi
            echo "update signing: no key in this fork, building without an update feed"
            exit 0
          fi
          echo '{"bundle":{"createUpdaterArtifacts":true}}' > src-tauri/tauri.updater.conf.json
          echo 'UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json' >> "$GITHUB_ENV"
          echo "UPDATES_SIGNED=true" >> "$GITHUB_ENV"
          echo "update signing: on"

      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure credentials for Windows signing. They are empty when that isn't set up, and
          # artifact-signing-cli only runs when the step above wrote its config.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # The update key. Used only when the step above turned update signing on; the password
          # is empty for a key made without one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "FolderSkin ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ needs.draft.outputs.notes }}
          releaseDraft: true
          prerelease: false
          retryAttempts: ${{ matrix.retries }}
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }} ${{ env.UPDATER_ARGS }}

      # tauri-action adds this platform to the draft's latest.json, but the four builds do it at
      # the same time and one can overwrite another's. So each keeps its own copy too, and the
      # update-feed job puts them together once all four are done.
      - name: Keep this platform's part of the update feed
        if: env.UPDATES_SIGNED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-feed-${{ matrix.feed }}
          path: latest.json
          if-no-files-found: error
          retention-days: 2

      # Gatekeeper's own verdict on the app that went into the .dmg, so a signing or notarization
      # problem fails here instead of on someone's Mac.
      - name: Check the macOS signature and notarization
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="target/universal-apple-darwin/release/bundle/macos/FolderSkin.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

  # The update feed: one latest.json with every platform, put together from each build's own copy
  # and attached to the draft in place of whichever copy won the race.
  update-feed:
    name: Update feed (every platform)
    needs: build
    if: ${{ inputs.publish != true }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Collect each platform's part
        uses: actions/download-artifact@v8
        with:
          pattern: update-feed-*
          path: update-feed

      - name: Put latest.json together and attach it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d update-feed ] && [ "$GITHUB_REPOSITORY" != "prajwal-svm/folderskin" ]; then
            echo "no update feed in this fork"
            exit 0
          fi
          part() { echo "update-feed/update-feed-$1/latest.json"; }
          for feed in darwin windows-x86_64 linux-x86_64 linux-aarch64; do
            test -s "$(part "$feed")" || { echo "the $feed build left no update feed" >&2; exit 1; }
          done
          # Every build read the same tag and notes, so they agree unless something went wrong.
          versions="$(jq -c '[.version, .notes]' update-feed/*/latest.json | sort -u | wc -l | tr -d ' ')"
          [ "$versions" = 1 ] || { echo "the builds disagree on the version or the notes" >&2; exit 1; }
          jq -n \
            --slurpfile mac "$(part darwin)" \
            --slurpfile win "$(part windows-x86_64)" \
            --slurpfile x64 "$(part linux-x86_64)" \
            --slurpfile arm "$(part linux-aarch64)" '
              def own($doc; $prefix): $doc.platforms | with_entries(select(.key | startswith($prefix)));
              {
                version: $mac[0].version,
                notes: $mac[0].notes,
                pub_date: ([$mac[0], $win[0], $x64[0], $arm[0]] | map(.pub_date) | max),
                platforms: (own($mac[0]; "darwin-") + own($win[0]; "windows-x86_64")
                  + own($x64[0]; "linux-x86_64") + own($arm[0]; "linux-aarch64"))
              }' > latest.json
          for key in darwin-aarch64 darwin-x86_64 darwin-aarch64-app darwin-x86_64-app \
            windows-x86_64 windows-x86_64-msi windows-x86_64-nsis \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb \
            linux-aarch64 linux-aarch64-appimage linux-aarch64-deb; do
            jq -e --arg k "$key" '.platforms | has($k)' latest.json >/dev/null \
              || { echo "latest.json offers nothing for $key" >&2; exit 1; }
          done
          jq -r '.platforms | keys | join(" ")' latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # A draft handed over for review still has to be complete. Each platform uploads its own
  # installers, so a platform that failed would otherwise leave a release that looks finished.
  draft-ready:
    name: Draft is complete (not published)
    needs: [build, update-feed]
    if: ${{ always() && inputs.publish != true }}
    runs-on: ubuntu-22.04
    permissions:
      # A draft release is only visible to a token that can write, so read access can't see it.
      contents: write
    steps:
      - name: Require every platform's installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BUILD: ${{ needs.build.result }}
          FEED: ${{ needs.update-feed.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD" != "success" ]; then
            echo "a platform build did not succeed, so the draft for $TAG is incomplete" >&2
            exit 1
          fi
          if [ "$FEED" != "success" ]; then
            echo "the update feed wasn't put together, so the draft for $TAG is incomplete" >&2
            exit 1
          fi
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=()
          grep -qE '\.dmg$'                      <<<"$assets" || missing+=("macOS .dmg")
          grep -qE '\.(msi|exe)$'                <<<"$assets" || missing+=("Windows .msi/.exe")
          grep -qE '_(amd64|x86_64)\.AppImage$'  <<<"$assets" || missing+=("Linux x86_64 .AppImage")
          grep -qE '_(arm64|aarch64)\.AppImage$' <<<"$assets" || missing+=("Linux ARM64 .AppImage")
          grep -qE '_amd64\.deb$'                <<<"$assets" || missing+=("Linux x86_64 .deb")
          grep -qE '_arm64\.deb$'                <<<"$assets" || missing+=("Linux ARM64 .deb")
          # the update feed, for this version and every platform (not in a fork, which has none)
          if [ "$GITHUB_REPOSITORY" = "prajwal-svm/folderskin" ]; then
            if grep -qx 'latest.json' <<<"$assets"; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -O latest.json --clobber
              [ "$(jq -r .version latest.json)" = "${TAG#v}" ] || missing+=("a latest.json for ${TAG#v}")
              for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64 linux-aarch64; do
                jq -e --arg k "$key" '.platforms | has($k)' latest.json >/dev/null || missing+=("$key in latest.json")
              done
            else
              missing+=("latest.json, the update feed")
            fi
          fi
          if ((${#missing[@]})); then
            printf 'the draft for %s is incomplete; missing: %s\n' "$TAG" "${missing[*]}" >&2
            exit 1
          fi
          echo "$TAG is a complete draft. Try its installers, then run this workflow again with publish ticked."

  # Publishing flips the reviewed draft to public after checking it once more. It builds nothing,
  # so what goes out is exactly what was tried.
  publish:
    name: Publish (every platform present)
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Require every platform's installers, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            echo "there is no release for $TAG yet. Push the tag first; it builds the draft." >&2
            exit 1
          fi
          if [ "$draft" != "true" ]; then
            echo "$TAG is already published"
            exit 0
          fi
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=()
          grep -qE '\.dmg$'                      <<<"$assets" || missing+=("macOS .dmg")
          grep -qE '\.(msi|exe)$'                <<<"$assets" || missing+=("Windows .msi/.exe")
          grep -qE '_(amd64|x86_64)\.AppImage$'  <<<"$assets" || missing+=("Linux x86_64 .AppImage")
          grep -qE '_(arm64|aarch64)\.AppImage$' <<<"$assets" || missing+=("Linux ARM64 .AppImage")
          grep -qE '_amd64\.deb$'                <<<"$assets" || missing+=("Linux x86_64 .deb")
          grep -qE '_arm64\.deb$'                <<<"$assets" || missing+=("Linux ARM64 .deb")
          # the update feed, for this version and every platform (not in a fork, which has none)
          if [ "$GITHUB_REPOSITORY" = "prajwal-svm/folderskin" ]; then
            if grep -qx 'latest.json' <<<"$assets"; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -O latest.json --clobber
              [ "$(jq -r .version latest.json)" = "${TAG#v}" ] || missing+=("a latest.json for ${TAG#v}")
              for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64 linux-aarch64; do
                jq -e --arg k "$key" '.platforms | has($k)' latest.json >/dev/null || missing+=("$key in latest.json")
              done
            else
              missing+=("latest.json, the update feed")
            fi
          fi
          if ((${#missing[@]})); then
            printf 'refusing to publish %s; missing: %s\n' "$TAG" "${missing[*]}" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "published $TAG"
