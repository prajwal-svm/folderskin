name: Icon packs

# Publishes the composer's downloadable icon packs as assets of an `icons-v*` release. The app
# downloads them from there and checks each against the SHA-256 in src/composer/icons/catalog.ts,
# so this rebuilds every pack from its pinned npm release and refuses to publish anything that
# doesn't match the catalog byte for byte.
#
# The release is never marked latest: the app's updater and the website read releases/latest.
on:
  push:
    tags: ["icons-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. icons-v1"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build, check and publish the packs
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build every pack and check it against the catalog
        run: node scripts/icon-packs.mjs --all --verify

      - name: Publish them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          grep -q "ICON_RELEASE = \"$TAG\"" src/composer/icons/catalog.ts || {
            echo "The catalog downloads from another release than $TAG; bump ICON_RELEASE in scripts/icon-packs.mjs and rebuild."
            exit 1
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-icons/*.json --clobber
          else
            gh release create "$TAG" dist-icons/*.json --latest=false \
              --title "Icon packs ($TAG)" \
              --notes "The composer's downloadable icon packs, built by scripts/icon-packs.mjs from pinned npm releases. The app checks each download against the SHA-256 it carries."
          fi
