name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/styles/tokens.css"
      - "src/state/theme.ts"
      - "src/assets/onboarding/**"
      - "public/**"
      - "docs/images/app*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "src/styles/tokens.css"
      - "src/state/theme.ts"
      - "src/assets/onboarding/**"
      - "public/**"
      - "docs/images/app*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test installer selection
        run: pnpm site:test
      - name: Refresh public release metadata
        if: github.event_name != 'pull_request'
        run: pnpm site:refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build website
        run: pnpm site:build
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
