[package]
name = "folderskin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Give your folders a skin"

[lib]
name = "folderskin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `devtools` feature: that would put the web inspector into release builds too.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Updates come over the same reqwest and rustls (aws-lc-rs) as the AI requests: the plugin's
# `rustls-tls` feature would add ring, a second crypto library, and `zip` only reads the zipped
# installers of Tauri 1-style updates. macOS always has the tar and gzip its .app.tar.gz needs.
tauri-plugin-updater = { version = "2", default-features = false, features = ["system-proxy"] }
folderskin-core.workspace = true
folderskin-ai = { path = "../crates/folderskin-ai" }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64 = "0.22"
sha2.workspace = true
# A pack's pictures download a few at a time (`StreamExt::buffered`). Already in the tree through
# reqwest, with the same features.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Seals the saved API keys (AES-256-GCM with an HKDF-SHA256 key; see keys.rs). Already built for
# rustls, which reqwest uses, so this adds no crate.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }

# Tauri's mock runtime, so a test can send a command the bytes a webview sends (composer.rs,
# tree.rs). The feature adds no crate. Left off Windows: with it, the lib's test binary imports a
# WebView2 entry point the loader can't resolve there and the binary won't start at all.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["macos-private-api", "test"] }

[target.'cfg(windows)'.dependencies]
# The machine GUID that ties the saved API keys to this computer (keys.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry", "NSDictionary", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSResponder", "NSRunningApplication"] }
