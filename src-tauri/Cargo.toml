[package]
name = "folderskin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Give your folders a skin"

[lib]
name = "folderskin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
folderskin-core.workspace = true
folderskin-ai = { path = "../crates/folderskin-ai" }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64 = "0.23"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry", "NSDictionary", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSResponder", "NSRunningApplication"] }
