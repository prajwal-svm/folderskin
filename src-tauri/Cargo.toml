[package]
name = "folderskin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Give your folders a skin"

[lib]
name = "folderskin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `devtools` feature: that would put the web inspector into release builds too.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Updates come over the same reqwest and rustls (aws-lc-rs) as the AI requests: the plugin's
# `rustls-tls` feature would add ring, a second crypto library, and `zip` only reads the zipped
# installers of Tauri 1-style updates. macOS always has the tar and gzip its .app.tar.gz needs.
tauri-plugin-updater = { version = "2", default-features = false, features = ["system-proxy"] }
# folderskin://install links, from the Install buttons on folderskin.app (deep_link.rs). The scheme
# is in tauri.conf.json, which the bundles register with the system.
tauri-plugin-deep-link = "2"
folderskin-core.workspace = true
folderskin-ai = { path = "../crates/folderskin-ai" }
# "This computer": open-weight models set up and run here, shared with the command line.
folderskin-local = { path = "../crates/folderskin-local" }
# Sharing a pack: the computer's key and signed requests to the community service.
folderskin-share = { path = "../crates/folderskin-share" }
# The random part of the pause before an upload is tried again. Already in the tree through
# folderskin-core, which draws pack ids with it.
getrandom = "0.3"
image.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
# `sync` for the community catalog's load lock and download turns and the local painting's turn,
# `rt` for a provider's request on a task Stop can drop; Tauri's own tokio already has both, so
# they add nothing to the build.
tokio = { workspace = true, features = ["sync", "rt"] }
base64 = "0.22"
sha2.workspace = true
# A pack's pictures download a few at a time (`StreamExt::buffered`). Already in the tree through
# reqwest, with the same features.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The sealed API key store, shared with the `folderskin` command line.
folderskin-keys = { path = "../crates/folderskin-keys" }
# The community catalog: searched on this computer, and the published tree it comes with.
folderskin-catalog = { path = "../crates/folderskin-catalog" }

# Tauri's mock runtime, so a test can send a command the bytes a webview sends (composer.rs,
# tree.rs). The feature adds no crate. Left off Windows: with it, the lib's test binary imports a
# WebView2 entry point the loader can't resolve there and the binary won't start at all.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["macos-private-api", "test"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# On Windows and Linux a folderskin:// link starts a second FolderSkin with the link as its
# argument: this hands the link to the one already running and ends the new one. macOS sends links
# to the running app itself, so it goes without.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
# The icon a folder already wears, drawn from the file its desktop.ini names (folder_icon.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry", "NSDictionary", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSResponder", "NSRunningApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow"] }
