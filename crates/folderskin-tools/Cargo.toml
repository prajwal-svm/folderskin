[package]
name = "folderskin-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI to make and check FolderSkin skin packs and preview skins"

[lib]
path = "src/lib.rs"

[[bin]]
name = "folderskin-tools"
path = "src/main.rs"

[dependencies]
folderskin-core.workspace = true
image.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
folderskin-catalog = { path = "../folderskin-catalog" }
# `community`: signed requests to the community service, run to completion on a small runtime.
folderskin-share = { path = "../folderskin-share" }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
