[package]
name = "folderskin-keys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FolderSkin's sealed API key store, shared by the app and the command line"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# Seals the saved API keys (AES-256-GCM with an HKDF-SHA256 key). Already built for rustls, which
# reqwest uses, so this adds no crate.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }

[target.'cfg(windows)'.dependencies]
# The machine GUID that ties the saved API keys to this computer.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
