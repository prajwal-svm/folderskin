[package]
name = "folderskin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FolderSkin core: folder icon compositor and per-OS icon writers"

[dependencies]
image.workspace = true
tiny-skia.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
# The random part of a new pack id, from the system's secure source. Already in the tree.
getrandom = "0.3"
# Lossless WebP for community pictures: libwebp itself (BSD-3-Clause), built from source by
# libwebp-sys (MIT) and wrapped by this crate (MIT or Apache-2.0), so nothing needs cwebp
# installed. The `image` crate's own lossless WebP encoder makes files no smaller than PNG.
# Without its `img` feature, which only adds conversions from the `image` crate's types.
webp = { version = "0.3.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Win32_UI_Shell_Common is for ITEMIDLIST: the Desktop hears about a changed icon as an item id
# list, not as a path (see the `notify` in apply/windows.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
