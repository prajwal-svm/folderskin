[package]
name = "folderskin-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bring-your-own-key image generation for FolderSkin"

[dependencies]
# What an answer becomes: a keyed-out folder or artwork cropped for the template.
folderskin-core.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
# The pictures sent with a request are recorded with its skin by their hash (recipe::Record).
sha2.workspace = true
thiserror.workspace = true
base64 = "0.22"
# Its timer, for polling Black Forest Labs without holding a runtime thread; reqwest already runs
# on tokio wherever this crate is used.
tokio.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "charset", "http2"] }

[dev-dependencies]
# A runtime to send each provider's request to a stand-in on localhost (tests/providers.rs).
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
