# cargo-deny policy for the whole Rust workspace. CI runs it as
#   cargo deny check --workspace --all-features
# from the repository root.

[graph]
all-features = true

[advisories]
yanked = "warn"
# Everything ignored here is an "unmaintained" notice, not a vulnerability, for a crate Tauri
# itself pulls in with no maintained replacement to move to. Dependabot brings them back up when
# Tauri changes.
ignore = [
  # proc-macro-error, a build-time macro of the GTK 3 bindings Tauri's Linux side uses.
  "RUSTSEC-2024-0370",
  # zvariant, zvariant_derive and zbus_names, which moved into zbus 6. The Linux D-Bus side of the
  # opener, notification and single-instance plugins (and notify-rust) still needs zbus 5, in every
  # release up to opener 2.7.2, notification 2.8.0 and single-instance 2.5.5.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
# Licences a third-party crate can have: permissive ones, plus MPL-2.0, whose copyleft stays
# inside the files of the crate that uses it. All of them can ship in FolderSkin, which is GPL-3.0,
# and none of them is the GPL, so the only GPL code in the app is FolderSkin's own and the choice
# of licence for the app stays with its authors.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# FolderSkin's own crates, which take the workspace's GPL-3.0.
exceptions = [
  { allow = ["GPL-3.0-only"], crate = "folderskin" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-ai" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-catalog" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-cli" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-core" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-keys" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-local" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-share" },
  { allow = ["GPL-3.0-only"], crate = "folderskin-tools" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
